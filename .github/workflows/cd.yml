name: CD Pipeline - SWIFT WAY

on:
  push:
    branches:
      - main

jobs:
  build-and-push-docker:
    name: Build e Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no Docker Hub (ou outro Container Registry)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da Imagem do Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: julinhatubaraoo/swift-way-backend:latest, julinhatubaraoo/swift-way-backend:${{ github.sha }}

